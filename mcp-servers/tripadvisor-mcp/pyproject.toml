[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripadvisor-mcp"
version = "0.2.0"
description = "MCP server for Tripadvisor places (Terra Partner API) over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Esa Krissa" }, { name = "Pavel Shklovsky (original Content API server)" }]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.0,<1",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
tripadvisor-mcp = "tripadvisor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripadvisor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tripadvisor_mcp"]
