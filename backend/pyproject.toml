[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "villa-ops-ai"
version = "0.1.0"
description = "AI-powered operations assistant for villa/hotel property managers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.162.0,<0.163",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.6.0,<4",
    # Database
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    # Config
    "pydantic-settings>=2.16.0",
    # Cache
    "redis[hiredis]>=8.1.0",
    # Auth
    "authlib>=1.9.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    # Validation
    "email-validator>=2.1.0",
    "itsdangerous>=2.1.0",
    # HTTP client
    "httpx>=0.28.0",
    # AI / Agent
    "langgraph>=1.2.19,<1.3",
    "litellm>=1.106.0,<1.107",
    "mcp>=2.3.0,<3",
    "langchain-litellm>=0.11.2,<0.12",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "psycopg[binary]>=3.1.0",
    # Payments
    "stripe>=16.1.0,<17",
    # Utilities
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    # Linting & formatting
    "ruff>=0.8.0",
    # Type checking
    "mypy>=1.13.0",
    # SQLAlchemy stubs
    "sqlalchemy-stubs>=0.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults (FastAPI Depends/Query/Path)
    "TC001", # move application import into TYPE_CHECKING (breaks FastAPI DI)
    "TC002", # move third-party import into TYPE_CHECKING (breaks FastAPI DI)
    "TC003", # move stdlib import into TYPE_CHECKING (breaks FastAPI DI)
    "RUF003", # ambiguous unicode characters in comments
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "authlib.*",
    "jose.*",
    "litellm.*",
    "langgraph.*",
    "langchain_litellm.*",
    "langchain_core.*",
    "mcp.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/agent/test_agent.py",
    "app/agent/graph.py",
    "app/agent/mcp_client.py",
    "app/mcp/test_mcp_client.py",
    "app/mcp/server.py",
    "app/api/v1/chat.py",
    "app/billing/scripts/*",
]
concurrency = ["greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
]
